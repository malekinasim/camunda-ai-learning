version: "3.7"
services:
  zeebe:
    image: camunda/zeebe:8.6.0
    container_name: zeebe
    ports:
      - "26500:26500" # gRPC (Zeebe client)
      - "8080:8080"   # REST API
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=camundaai
      - POSTGRES_USER=camunda
      - POSTGRES_PASSWORD=camunda
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
  tasklist:
    image: camunda/tasklist:8.6.0
    container_name: tasklist
    ports:
      - "8082:8080" # Tasklist UI + REST API (separate from Operate's 8081)
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_CSRFPREVENTIONENABLED=false
      - CAMUNDA_TASKLIST_USERID=agent-bot
      - CAMUNDA_TASKLIST_PASSWORD=agent-bot-secret
      - CAMUNDA_TASKLIST_DISPLAYNAME=Agent Bot
    depends_on:
      - zeebe
      - elasticsearch
  operate:
    image: camunda/operate:8.6.0
    container_name: operate
    ports:
      - "8081:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - zeebe
      - elasticsearch
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camunda-ai-app
    ports:
      - "9090:9090"
    environment:
      - CAMUNDA_CLIENT_ZEEBE_GRPCADDRESS=http://zeebe:26500
      - CAMUNDA_CLIENT_ZEEBE_RESTADDRESS=http://zeebe:8080
      - TASKLIST_BASE_URL=http://tasklist:8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/camundaai
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - zeebe
      - postgres
volumes:
  postgres-data:
