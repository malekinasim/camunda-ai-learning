version: "3.7"

# A minimal local Camunda 8 stack for learning.
# - Zeebe: the process engine that actually executes your BPMN
# - Operate: a web UI to watch process instances running live (great for learning!)
#
# Start with: docker compose up -d
# Zeebe gRPC:  localhost:26500
# Zeebe REST:  localhost:8080
# Operate UI:  http://localhost:8081

services:
  zeebe:
    image: camunda/zeebe:8.6.0
    container_name: zeebe
    ports:
      - "26500:26500" # gRPC (Zeebe client)
      - "8080:8080"   # REST API
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  operate:
    image: camunda/operate:8.6.0
    container_name: operate
    ports:
      - "8081:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - zeebe
      - elasticsearch
